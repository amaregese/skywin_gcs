<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC - Geo-Fence Editor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/style.css?v=10" />
  <style>
    #main { flex-direction: row; }
    #fenceSidebar {
      width: 320px; min-width: 280px; background: #1e293b; overflow-y: auto;
      border-right: 1px solid #334155; display: flex; flex-direction: column; flex-shrink: 0;
    }
    #fenceSidebar h3 {
      color: #7c3aed; font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      padding: 12px 12px 8px; margin: 0;
    }
    .wp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .wp-table th {
      text-align: left; padding: 6px 8px; background: #0f172a;
      color: #64748b; font-weight: 600; position: sticky; top: 0; z-index: 1;
    }
    .wp-table td { padding: 4px 8px; border-bottom: 1px solid #1e293b; }
    .wp-table tr:hover td { background: #334155; }
    .wp-num { color: #eab308; font-weight: 700; width: 30px; }
    .wp-table input {
      background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 4px; padding: 3px 6px; font-size: 12px; width: 100%;
      outline: none; box-sizing: border-box;
    }
    .wp-table input:focus { border-color: #eab308; }
    .plan-btns { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .plan-btns button {
      background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .plan-btns button:hover { background: #334155; }
    .plan-btns button.primary { background: #7c3aed; border-color: #7c3aed; }
    .plan-btns button.primary:hover { background: #6d28d9; }
    .plan-btns button.danger { background: #ef4444; border-color: #ef4444; }
    .plan-btns button.danger:hover { background: #dc2626; }
    .plan-btns button.success { background: #22c55e; border-color: #22c55e; color: #0f172a; }
    .plan-btns button.success:hover { background: #16a34a; }
    .plan-btns button.warning { background: #eab308; border-color: #eab308; color: #0f172a; }
    .plan-btns button.warning:hover { background: #d97706; }


    .delete-wp { color: #ef4444; cursor: pointer; font-weight: 700; text-align: center; }
    .delete-wp:hover { color: #dc2626; }
    .plan-status { padding: 8px 12px; color: #94a3b8; font-size: 12px; border-top: 1px solid #334155; margin-top: auto; }
  </style>
</head>
<body>
  <div id="app">
    <nav id="menubar">
      <div class="menu-title">SGC - Geo-Fence Editor</div>
    </nav>

    <div id="toolbar">
      <button class="toolbar-back" onclick="location.href='/'">&#8592;</button>
      <button id="connectBtn" onclick="toggleConnection()">CONNECT</button>
      <div class="toolbar-sep"></div>
      <span id="heartbeatInd" class="indicator off">&#9679; Heartbeat: --</span>
      <span class="toolbar-sep"></span>
      <button id="tlogBtn" class="tlog-btn" onclick="toggleTlog()">&#9679; LOG</button>
    </div>
    <img src="/logo.png" id="logoLine" alt="SGC">

    <div id="main">
      <div id="fenceSidebar">
        <h3>GEO-FENCE</h3>
        <div class="plan-btns">
          <button class="primary" onclick="uploadFence()">UPLOAD</button>
          <button onclick="downloadFence()">DOWNLOAD</button>
          <button onclick="saveFenceFile()">SAVE</button>
          <button onclick="loadFenceFile()">LOAD</button>
          <button class="danger" onclick="clearFence()">CLEAR</button>
        </div>
        <div style="flex:1;overflow-y:auto">
          <table class="wp-table">
            <thead><tr>
              <th style="width:30px">#</th>
              <th style="width:120px">Lat</th>
              <th style="width:120px">Lon</th>
              <th style="width:24px"></th>
            </tr></thead>
            <tbody id="fenceList"></tbody>
          </table>
        </div>
        <div class="plan-status" id="fenceStatus">No fence loaded. Click map to add vertices.</div>
      </div>

      <div id="map" class="map-container"></div>
    </div>

    <div id="notifContainer"></div>

    <div id="statusbar">
      <span id="statusMessage">Geo-Fence Editor</span>
    </div>
  </div>

  <div id="mapContextMenu" class="context-menu hidden">
    <div onclick="addFencePointFromMenu()">Add fence point here</div>
  </div>

  <input type="file" id="fenceFileInput" accept=".fence,.txt" style="display:none">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/toolbar.js?v=10"></script>
  <script src="/static/js/grid.js?v=10"></script>
  <script src="/static/js/fence.js?v=10"></script>
</body>
</html>
