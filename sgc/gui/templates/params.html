<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC - Full Parameter List</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { overflow: hidden; }
    #paramPage {
      display: flex; flex-direction: column; height: 100vh;
    }
    .param-header {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: #1e293b; border-bottom: 1px solid #334155; flex-shrink: 0;
    }
    .param-header h2 {
      color: #e2e8f0; font-size: 15px; font-weight: 600; margin: 0;
    }
    .param-header .back-btn {
      background: #334155; color: #e2e8f0; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 12px; cursor: pointer;
    }
    .param-header .back-btn:hover { background: #475569; }
    .param-header .refresh-btn {
      background: #7c3aed; color: white; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: auto;
    }
    .param-header .refresh-btn:hover { background: #6d28d9; }
    .param-header .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .param-search {
      padding: 8px 16px; background: #0f172a; border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .param-search input {
      width: 100%; background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 8px 12px; font-size: 13px; outline: none;
      box-sizing: border-box;
    }
    .param-search input:focus { border-color: #7c3aed; }
    .param-table-wrap {
      flex: 1; overflow-y: auto; overflow-x: auto;
    }
    .param-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .param-table th {
      position: sticky; top: 0; background: #1e293b; color: #94a3b8;
      padding: 8px 12px; text-align: left; font-weight: 600; font-size: 11px;
      letter-spacing: 0.5px; border-bottom: 1px solid #334155; z-index: 1;
    }
    .param-table td {
      padding: 6px 12px; border-bottom: 1px solid #1e293b; color: #e2e8f0;
    }
    .param-table tr:hover td { background: #1e293b; }
    .param-table .param-name {
      font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; color: #0ea5e9;
    }
    .param-table .param-value input {
      background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 4px; padding: 4px 8px; font-size: 12px; width: 100px;
      font-family: 'SF Mono', 'Consolas', monospace;
    }
    .param-table .param-value input:focus { border-color: #7c3aed; outline: none; }
    .param-table .param-value input.changed { border-color: #eab308; }
    .param-table .save-btn {
      background: transparent; color: #22c55e; border: 1px solid #22c55e;
      border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer;
    }
    .param-table .save-btn:hover { background: #22c55e; color: #0f172a; }
    .param-count {
      color: #64748b; font-size: 12px; padding: 4px 16px 8px;
      background: #0f172a; flex-shrink: 0; border-bottom: 1px solid #1e293b;
    }
    .param-status {
      color: #eab308; font-size: 12px; padding: 4px 16px 8px;
      background: #0f172a; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="paramPage">
    <div class="param-header">
      <button class="back-btn" onclick="location.href='/'">&#8592; Dashboard</button>
      <h2>Full Parameter List</h2>
      <button class="refresh-btn" id="refreshBtn" onclick="requestParams()">&#x21bb; Refresh</button>
    </div>
    <div class="param-search">
      <input type="text" id="paramSearch" placeholder="Search parameters..." oninput="filterParams()" />
    </div>
    <div id="paramStatus" class="param-status" style="display:none"></div>
    <div id="paramCount" class="param-count">0 parameters loaded</div>
    <div class="param-table-wrap">
      <table class="param-table">
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th>Name</th>
            <th style="width:40px">Type</th>
            <th style="width:180px">Value</th>
            <th style="width:70px"></th>
          </tr>
        </thead>
        <tbody id="paramBody"></tbody>
      </table>
    </div>
  </div>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/params.js"></script>
</body>
</html>
