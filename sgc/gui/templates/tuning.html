<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC - Basic Tuning</title>
  <link rel="stylesheet" href="/static/css/style.css?v=13" />
  <style>
    body { overflow: hidden; }
    #main { flex-direction: column; }
    .plan-toolbar { padding: 8px 12px; display: flex; gap: 6px; align-items: center; background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; }
    .plan-toolbar button {
      background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .plan-toolbar button:hover { background: #334155; }
    .plan-toolbar button.primary { background: #22c55e; border-color: #22c55e; color: #0f172a; }
    .plan-toolbar button.primary:hover { background: #16a34a; }
    .plan-toolbar button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .plan-toolbar .spacer { flex: 1; }
    .tune-wrap { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .tune-group {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      margin-bottom: 12px; overflow: hidden;
    }
    .tune-group-header {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      background: #252f3f; border-bottom: 1px solid #334155;
      cursor: pointer; user-select: none;
    }
    .tune-group-header:hover { background: #2d3a4f; }
    .tune-group-header .arrow { color: #64748b; font-size: 10px; width: 14px; transition: transform 0.15s; }
    .tune-group-header .arrow.open { transform: rotate(90deg); }
    .tune-group-header .gname { color: #0ea5e9; font-size: 13px; font-weight: 600; }
    .tune-group-header .gcount { color: #64748b; font-size: 11px; margin-left: auto; }
    .tune-group-body { display: none; padding: 4px 14px 10px; }
    .tune-group-body.open { display: block; }

    .tune-param {
      display: flex; flex-direction: column; gap: 4px;
      padding: 8px 0; border-bottom: 1px solid #1a2332;
    }
    .tune-param:last-child { border-bottom: none; }
    .tune-param-row {
      display: flex; align-items: center; gap: 12px;
    }
    .tune-param-name {
      font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; color: #94a3b8;
      min-width: 180px; white-space: nowrap;
    }
    .tune-param-human {
      font-size: 11px; color: #e2e8f0; font-weight: 500;
    }
    .tune-param-slider {
      flex: 1; min-width: 100px;
    }
    .tune-param-slider input[type="range"] {
      width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
      background: #334155; border-radius: 2px; outline: none;
      cursor: pointer;
    }
    .tune-param-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #7c3aed; border: 2px solid #e2e8f0; cursor: pointer;
    }
    .tune-param-slider input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: #7c3aed; border: 2px solid #e2e8f0; cursor: pointer;
    }
    .tune-param-value {
      display: flex; align-items: center; gap: 6px; min-width: 100px;
    }
    .tune-param-value input[type="number"] {
      width: 72px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 4px; padding: 4px 6px; font-size: 12px;
      font-family: 'SF Mono', 'Consolas', monospace; text-align: right;
    }
    .tune-param-value input[type="number"]:focus { border-color: #7c3aed; outline: none; }
    .tune-param-value input.changed { border-color: #eab308; }
    .tune-param-value .changed-badge {
      color: #eab308; font-size: 11px; display: none;
    }
    .tune-param-value .changed-badge.show { display: inline; }
    .tune-param-value .units-label {
      color: #64748b; font-size: 11px;
    }
    .tune-param-desc {
      font-size: 11px; color: #64748b; padding-left: 194px;
    }
    .tune-status {
      color: #eab308; font-size: 12px; padding: 6px 12px;
      background: #0f172a; flex-shrink: 0; border-bottom: 1px solid #1e293b;
    }
    .tune-not-connected {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: #64748b; font-size: 14px;
    }
    .tune-spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid #64748b;
      border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tune-group-body .tune-not-connected { height: 60px; }

    .tune-tabs {
      display: flex; background: #0f172a; border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .tune-tab {
      padding: 8px 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
      color: #64748b; cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s; user-select: none;
    }
    .tune-tab:hover { color: #e2e8f0; }
    .tune-tab.active { color: #7c3aed; border-bottom-color: #7c3aed; }
  </style>
</head>
<body>
  <div id="app">
    <div id="topBar">
      <img src="/logo.png" id="topLogo" alt="SWL">
    </div>
    <div id="toolbar">
      <div class="tb-top">
        <span class="tb-brand-acronym">
          <svg viewBox="0 0 28 28" width="22" height="22" class="tb-brand-icon">
            <defs>
              <linearGradient id="gcsGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
              <linearGradient id="gcsGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
            </defs>
            <circle cx="14" cy="14" r="13" fill="none" stroke="url(#gcsGrad)" stroke-width="1.5" opacity="0.25"/>
            <circle cx="14" cy="14" r="9" fill="none" stroke="url(#gcsGrad)" stroke-width="1.2" opacity="0.35"/>
            <circle cx="14" cy="14" r="5" fill="none" stroke="url(#gcsGrad)" stroke-width="1" opacity="0.5"/>
            <circle cx="14" cy="14" r="2.5" fill="url(#gcsGrad)" opacity="0.8"/>
            <line x1="14" y1="0" x2="14" y2="6" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <line x1="14" y1="22" x2="14" y2="28" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <line x1="0" y1="14" x2="6" y2="14" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <line x1="22" y1="14" x2="28" y2="14" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <path d="M8 5.5c-4 2.5-6 7-6 11.5" stroke="url(#gcsGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
            <path d="M20 5.5c4 2.5 6 7 6 11.5" stroke="url(#gcsGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
            <path d="M6 20c2 3 5 5 8 5s6-2 8-5" stroke="url(#gcsGrad)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.25"/>
          </svg>
          SGC
        </span>
        <span class="tb-software-name">SKYWIN GROUND CONTROL STATION</span>
      </div>
      <div class="tb-sep-h"></div>
      <div class="tb-bottom">
        <button class="toolbar-back" onclick="location.href='/'" title="Back to Home">&#8592;</button>
        <div id="tbHamburger" onclick="toggleToolbarMenu()">
          <span></span><span></span><span></span>
        </div>
        <div id="tbMenu">
          <div class="tb-menu-header"><span class="tb-menu-header-icon">📁</span> FILE</div>
          <button class="tb-menu-btn" onclick="menuAction('New Mission');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📄</span> New Mission</button>
          <button class="tb-menu-btn" onclick="menuAction('Open Mission');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📂</span> Open Mission...</button>
          <button class="tb-menu-btn" onclick="menuAction('Save Mission');toggleToolbarMenu()"><span class="tb-menu-btn-icon">💾</span> Save Mission</button>
          <button class="tb-menu-btn" onclick="menuAction('Save Mission As');toggleToolbarMenu()"><span class="tb-menu-btn-icon">💾</span> Save Mission As...</button>
          <div class="tb-menu-sep"></div>
          <button class="tb-menu-btn" onclick="menuAction('Export Log');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📤</span> Export Log...</button>
          <div class="tb-menu-sep"></div>
          <button class="tb-menu-btn" onclick="menuAction('Exit');toggleToolbarMenu()"><span class="tb-menu-btn-icon">🚪</span> Exit</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">🗺️</span> FLIGHT PLAN</div>
          <button class="tb-menu-btn" onclick="location.href='/plan'"><span class="tb-menu-btn-icon">✈️</span> Waypoints</button>
          <button class="tb-menu-btn" onclick="location.href='/survey'"><span class="tb-menu-btn-icon">📡</span> Survey Grid</button>
          <button class="tb-menu-btn" onclick="location.href='/fence'"><span class="tb-menu-btn-icon">🛡️</span> Geo-Fence</button>
          <button class="tb-menu-btn" onclick="location.href='/rally'"><span class="tb-menu-btn-icon">📍</span> Rally Points</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">⚙️</span> CONFIG</div>
          <button class="tb-menu-btn" onclick="location.href='/config'"><span class="tb-menu-btn-icon">🔧</span> Calibration</button>
          <button class="tb-menu-btn" onclick="location.href='/params'"><span class="tb-menu-btn-icon">📋</span> Full Parameters</button>
          <button class="tb-menu-btn" onclick="location.href='/tuning'"><span class="tb-menu-btn-icon">🎛️</span> Tuning</button>
          <button class="tb-menu-btn" onclick="location.href='/motor_test'"><span class="tb-menu-btn-icon">🔄</span> Motor Test</button>
          <button class="tb-menu-btn" onclick="location.href='/rc_override'"><span class="tb-menu-btn-icon">🎮</span> RC Override</button>
          <div class="tb-menu-sep"></div>
          <button class="tb-menu-btn" onclick="menuAction('App Settings');toggleToolbarMenu()"><span class="tb-menu-btn-icon">⚙️</span> App Settings...</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">📋</span> LOGS</div>
          <button class="tb-menu-btn" onclick="menuAction('Telemetry Logs');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📊</span> Telemetry Logs</button>
          <button class="tb-menu-btn" onclick="menuAction('DataFlash Logs');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📀</span> DataFlash Logs</button>
          <button class="tb-menu-btn" onclick="toggleConsole();toggleToolbarMenu()"><span class="tb-menu-btn-icon">💻</span> Console</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">❓</span> HELP</div>
          <button class="tb-menu-btn" onclick="menuAction('About');toggleToolbarMenu()"><span class="tb-menu-btn-icon">ℹ️</span> About SGC</button>
        </div>
        <button id="connectBtn" class="tb-btn tb-connect" onclick="toggleConnection()">&#x25CF; Connect</button>
        <button id="tlogBtn" class="tb-btn tb-tlog" onclick="toggleTlog()">&#x25CF; DATA LOG</button>
      </div>
    </div>

    <div id="main">
      <div class="tune-tabs">
        <div id="tabBasic" class="tune-tab active" onclick="switchTab('basic')">Basic Tuning</div>
        <div id="tabExtended" class="tune-tab" onclick="switchTab('extended')">Extended Tuning</div>
      </div>
      <div class="plan-toolbar">
        <div class="spacer"></div>
        <button id="writeBtn" onclick="writeParams()" disabled>&#x2713; Write Params</button>
        <button class="primary" id="refreshBtn" onclick="refreshParams()">&#x21bb; Refresh</button>
      </div>
      <div id="tuneStatus" class="tune-status" style="display:none"></div>
      <div id="tuneWrap" class="tune-wrap"></div>
    </div>
    <div id="extendedNotice" class="tune-not-connected" style="display:none">
      Extended Tuning is only available for Copter vehicles.
    </div>
  </div>
  <div id="notifContainer"></div>
  <script src="/static/lib/socket.io.min.js" onerror="this.onerror=null;this.src='https://cdn.socket.io/4.7.2/socket.io.min.js'"></script>
  <script src="/static/js/toolbar.js?v=13"></script>
  <script src="/static/js/tuning.js?v=10"></script>
</body>
</html>
