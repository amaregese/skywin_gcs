<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC - Basic Tuning</title>
  <link rel="stylesheet" href="/static/css/style.css?v=13" />
  <style>
    body { overflow: hidden; }
    #main { flex-direction: column; }
    .plan-toolbar { padding: 8px 12px; display: flex; gap: 6px; align-items: center; background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; }
    .plan-toolbar button {
      background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .plan-toolbar button:hover { background: #334155; }
    .plan-toolbar button.primary { background: #22c55e; border-color: #22c55e; color: #0f172a; }
    .plan-toolbar button.primary:hover { background: #16a34a; }
    .plan-toolbar button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .plan-toolbar .spacer { flex: 1; }
    .tune-wrap { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .tune-group {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      margin-bottom: 12px; overflow: hidden;
    }
    .tune-group-header {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      background: #252f3f; border-bottom: 1px solid #334155;
      cursor: pointer; user-select: none;
    }
    .tune-group-header:hover { background: #2d3a4f; }
    .tune-group-header .arrow { color: #64748b; font-size: 10px; width: 14px; transition: transform 0.15s; }
    .tune-group-header .arrow.open { transform: rotate(90deg); }
    .tune-group-header .gname { color: #0ea5e9; font-size: 13px; font-weight: 600; }
    .tune-group-header .gcount { color: #64748b; font-size: 11px; margin-left: auto; }
    .tune-group-body { display: none; padding: 4px 14px 10px; }
    .tune-group-body.open { display: block; }

    .tune-param {
      display: flex; flex-direction: column; gap: 4px;
      padding: 8px 0; border-bottom: 1px solid #1a2332;
    }
    .tune-param:last-child { border-bottom: none; }
    .tune-param-row {
      display: flex; align-items: center; gap: 12px;
    }
    .tune-param-name {
      font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; color: #94a3b8;
      min-width: 180px; white-space: nowrap;
    }
    .tune-param-human {
      font-size: 11px; color: #e2e8f0; font-weight: 500;
    }
    .tune-param-slider {
      flex: 1; min-width: 100px;
    }
    .tune-param-slider input[type="range"] {
      width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
      background: #334155; border-radius: 2px; outline: none;
      cursor: pointer;
    }
    .tune-param-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #7c3aed; border: 2px solid #e2e8f0; cursor: pointer;
    }
    .tune-param-slider input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: #7c3aed; border: 2px solid #e2e8f0; cursor: pointer;
    }
    .tune-param-value {
      display: flex; align-items: center; gap: 6px; min-width: 100px;
    }
    .tune-param-value input[type="number"] {
      width: 72px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 4px; padding: 4px 6px; font-size: 12px;
      font-family: 'SF Mono', 'Consolas', monospace; text-align: right;
    }
    .tune-param-value input[type="number"]:focus { border-color: #7c3aed; outline: none; }
    .tune-param-value input.changed { border-color: #eab308; }
    .tune-param-value .changed-badge {
      color: #eab308; font-size: 11px; display: none;
    }
    .tune-param-value .changed-badge.show { display: inline; }
    .tune-param-value .units-label {
      color: #64748b; font-size: 11px;
    }
    .tune-param-desc {
      font-size: 11px; color: #64748b; padding-left: 194px;
    }
    .tune-status {
      color: #eab308; font-size: 12px; padding: 6px 12px;
      background: #0f172a; flex-shrink: 0; border-bottom: 1px solid #1e293b;
    }
    .tune-not-connected {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: #64748b; font-size: 14px;
    }
    .tune-spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid #64748b;
      border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tune-group-body .tune-not-connected { height: 60px; }
  </style>
</head>
<body>
  <div id="app">
    <nav id="menubar">
      <div class="menu-title">SGC - Basic Tuning</div>
    </nav>

    <div id="toolbar">
      <button class="toolbar-back" onclick="location.href='/'">&#8592;</button>
      <div style="flex:1"></div>
      <img src="/logo.png" id="topLogo" alt="SGC">
    </div>

    <div id="main">
      <div class="plan-toolbar">
        <div class="spacer"></div>
        <button id="writeBtn" onclick="writeParams()" disabled>&#x2713; Write Params</button>
        <button class="primary" id="refreshBtn" onclick="refreshParams()">&#x21bb; Refresh</button>
      </div>
      <div id="tuneStatus" class="tune-status" style="display:none"></div>
      <div id="tuneWrap" class="tune-wrap"></div>
    </div>
  </div>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/tuning.js?v=10"></script>
</body>
</html>
