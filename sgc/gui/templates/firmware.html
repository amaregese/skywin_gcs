<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC - Firmware Installation</title>
  <link rel="stylesheet" href="/static/css/style.css?v=13" />
  <style>
    body { overflow: hidden; }
    #main { flex-direction: column; }

    .fw-wrap { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }

    /* Cards matching mt-card pattern */
    .fw-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden;
    }
    .fw-card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: #252f3f;
      border-bottom: 1px solid #334155;
    }
    .fw-card-header .fw-icon { font-size: 16px; }
    .fw-card-header .fw-title { color: #e2e8f0; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .fw-card-header .fw-sub { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .fw-card-body { padding: 14px 16px; }

    /* Tabs with icons */
    .fw-tab-bar { display: flex; gap: 4px; flex-wrap: wrap; }
    .fw-tab {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 14px; border: 1px solid #334155; border-radius: 6px;
      background: #0f172a; color: #64748b; cursor: pointer;
      font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
      transition: all 0.15s;
    }
    .fw-tab:hover { color: #e2e8f0; border-color: #6366f1; }
    .fw-tab.active { background: #6366f1; border-color: #6366f1; color: #fff; }
    .fw-tab-icon { font-size: 15px; line-height: 1; }

    /* Category pills */
    .fw-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .fw-pill {
      padding: 4px 14px; border: 1px solid #334155; border-radius: 12px;
      background: #0f172a; color: #64748b; cursor: pointer;
      font-size: 11px; font-weight: 600; transition: all 0.15s;
    }
    .fw-pill:hover { color: #e2e8f0; }
    .fw-pill.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    /* Search */
    .fw-search-bar { margin-bottom: 10px; }
    .fw-search-input {
      width: 100%; box-sizing: border-box;
      background: #0f172a; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 6px;
      padding: 8px 12px; font-size: 12px; outline: none;
    }
    .fw-search-input:focus { border-color: #7c3aed; }
    .fw-search-input::placeholder { color: #475569; }

    /* Board list as cards */
    .fw-board-list { display: flex; flex-direction: column; gap: 6px; min-height: 100px; }
    .fw-board-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border: 1px solid #334155; border-radius: 8px;
      background: #1e293b; cursor: pointer; transition: all 0.12s;
    }
    .fw-board-item:hover { border-color: #6366f1; background: rgba(99,102,241,0.06); }
    .fw-board-item.selected { border-color: #6366f1; background: rgba(99,102,241,0.12); }
    .fw-board-icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; line-height: 1; }
    .fw-board-info { flex: 1; min-width: 0; }
    .fw-board-name { font-size: 13px; font-weight: 600; color: #e2e8f0; }
    .fw-board-version { font-size: 11px; color: #64748b; margin-top: 2px; }
    .fw-board-frame { font-size: 10px; color: #6366f1; background: rgba(99,102,241,0.1); padding: 2px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
    .fw-show-more { text-align: center; padding: 10px; font-size: 12px; color: #6366f1; cursor: pointer; border: 1px dashed #334155; border-radius: 8px; }
    .fw-show-more:hover { background: rgba(99,102,241,0.06); }
    .fw-empty { text-align: center; padding: 40px 20px; color: #475569; font-size: 13px; }

    /* Selection bar */
    .fw-selection-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #1e293b;
      border: 1px solid #334155; border-radius: 8px;
    }
    .fw-selection-label { font-size: 12px; color: #94a3b8; }
    .fw-port-input {
      width: 80px; padding: 5px 8px; background: #0f172a; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 4px;
      font-size: 12px; text-align: center; outline: none; font-family: monospace;
    }
    .fw-port-input:focus { border-color: #7c3aed; }

    /* Modal */
    .fw-modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .fw-modal-overlay.open { display: flex; }
    .fw-modal {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 24px; max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto;
    }
    .fw-modal h2 { color: #e2e8f0; font-size: 15px; font-weight: 700; margin: 0 0 4px; }
    .fw-modal-close { float: right; background: none; border: none; color: #64748b; cursor: pointer; font-size: 20px; }

    .fw-progress-bar {
      width: 100%; height: 6px; background: #0f172a;
      border-radius: 3px; overflow: hidden; margin: 12px 0;
    }
    .fw-progress-fill { height: 100%; width: 0%; background: #6366f1; transition: width 0.3s; }

    .fw-log-panel {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 8px; max-height: 200px; overflow-y: auto;
      font-family: 'SF Mono', 'Consolas', 'JetBrains Mono', monospace;
      font-size: 10px; line-height: 1.6; margin-top: 12px;
    }
    .fw-log-entry { padding: 2px 0; }
    .fw-log-entry.error { color: #f87171; }
    .fw-log-entry.success { color: #4ade80; }
    .fw-log-entry.warning { color: #facc15; }
    .fw-log-entry.info { color: #64748b; }
  </style>
</head>
<body>
  <div id="app">
    <div id="topBar">
      <img src="/logo.png" id="topLogo" alt="SWL">
    </div>
    <div id="toolbar">
      <div class="tb-top">
        <span class="tb-brand-acronym">
          <svg viewBox="0 0 28 28" width="22" height="22" class="tb-brand-icon">
            <defs>
              <linearGradient id="gcsGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
              <linearGradient id="gcsGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
            </defs>
            <circle cx="14" cy="14" r="13" fill="none" stroke="url(#gcsGrad)" stroke-width="1.5" opacity="0.25"/>
            <circle cx="14" cy="14" r="9" fill="none" stroke="url(#gcsGrad)" stroke-width="1.2" opacity="0.35"/>
            <circle cx="14" cy="14" r="5" fill="none" stroke="url(#gcsGrad)" stroke-width="1" opacity="0.5"/>
            <circle cx="14" cy="14" r="2.5" fill="url(#gcsGrad)" opacity="0.8"/>
            <line x1="14" y1="0" x2="14" y2="6" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <line x1="14" y1="22" x2="14" y2="28" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <line x1="0" y1="14" x2="6" y2="14" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <line x1="22" y1="14" x2="28" y2="14" stroke="url(#gcsGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
            <path d="M8 5.5c-4 2.5-6 7-6 11.5" stroke="url(#gcsGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
            <path d="M20 5.5c4 2.5 6 7 6 11.5" stroke="url(#gcsGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
            <path d="M6 20c2 3 5 5 8 5s6-2 8-5" stroke="url(#gcsGrad)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.25"/>
          </svg>
          SGC
        </span>
        <span class="tb-software-name">SKYWIN GROUND CONTROL STATION</span>
      </div>
      <div class="tb-sep-h"></div>
      <div class="tb-bottom">
        <button class="toolbar-back" onclick="location.href='/'" title="Back to Home">&#8592;</button>
        <div id="tbHamburger" onclick="toggleToolbarMenu()">
          <span></span><span></span><span></span>
        </div>
        <div id="tbMenu">
          <div class="tb-menu-header"><span class="tb-menu-header-icon">📁</span> FILE</div>
          <button class="tb-menu-btn" onclick="menuAction('New Mission');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📄</span> New Mission</button>
          <button class="tb-menu-btn" onclick="menuAction('Open Mission');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📂</span> Open Mission...</button>
          <button class="tb-menu-btn" onclick="menuAction('Save Mission');toggleToolbarMenu()"><span class="tb-menu-btn-icon">💾</span> Save Mission</button>
          <button class="tb-menu-btn" onclick="menuAction('Save Mission As');toggleToolbarMenu()"><span class="tb-menu-btn-icon">💾</span> Save Mission As...</button>
          <div class="tb-menu-sep"></div>
          <button class="tb-menu-btn" onclick="menuAction('Export Log');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📤</span> Export Log...</button>
          <div class="tb-menu-sep"></div>
          <button class="tb-menu-btn" onclick="menuAction('Exit');toggleToolbarMenu()"><span class="tb-menu-btn-icon">🚪</span> Exit</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">🗺️</span> FLIGHT PLAN</div>
          <button class="tb-menu-btn" onclick="location.href='/plan'"><span class="tb-menu-btn-icon">✈️</span> Waypoints</button>
          <button class="tb-menu-btn" onclick="location.href='/survey'"><span class="tb-menu-btn-icon">📡</span> Survey Grid</button>
          <button class="tb-menu-btn" onclick="location.href='/fence'"><span class="tb-menu-btn-icon">🛡️</span> Geo-Fence</button>
          <button class="tb-menu-btn" onclick="location.href='/rally'"><span class="tb-menu-btn-icon">📍</span> Rally Points</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">⚙️</span> CONFIG</div>
          <button class="tb-menu-btn" onclick="location.href='/config'"><span class="tb-menu-btn-icon">🔧</span> Calibration</button>
          <button class="tb-menu-btn" onclick="location.href='/params'"><span class="tb-menu-btn-icon">📋</span> Full Parameters</button>
          <button class="tb-menu-btn" onclick="location.href='/tuning'"><span class="tb-menu-btn-icon">🎛️</span> Tuning</button>
          <button class="tb-menu-btn" onclick="location.href='/motor_test'"><span class="tb-menu-btn-icon">🔄</span> Motor Test</button>
          <button class="tb-menu-btn" onclick="location.href='/rc_override'"><span class="tb-menu-btn-icon">🎮</span> RC Override</button>
          <div class="tb-menu-sep"></div>
          <button class="tb-menu-btn" onclick="menuAction('App Settings');toggleToolbarMenu()"><span class="tb-menu-btn-icon">⚙️</span> App Settings...</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">📋</span> LOGS</div>
          <button class="tb-menu-btn" onclick="menuAction('Telemetry Logs');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📊</span> Telemetry Logs</button>
          <button class="tb-menu-btn" onclick="menuAction('DataFlash Logs');toggleToolbarMenu()"><span class="tb-menu-btn-icon">📀</span> DataFlash Logs</button>
          <button class="tb-menu-btn" onclick="toggleConsole();toggleToolbarMenu()"><span class="tb-menu-btn-icon">💻</span> Console</button>
          <div class="tb-menu-sep"></div>
          <div class="tb-menu-header"><span class="tb-menu-header-icon">❓</span> HELP</div>
          <button class="tb-menu-btn" onclick="menuAction('About');toggleToolbarMenu()"><span class="tb-menu-btn-icon">ℹ️</span> About SGC</button>
        </div>
        <button id="connectBtn" class="tb-btn tb-connect" onclick="toggleConnection()">&#x25CF; Connect</button>
        <button id="tlogBtn" class="tb-btn tb-tlog" onclick="toggleTlog()">&#x25CF; DATA LOG</button>
      </div>
    </div>

    <div id="main">
      <div class="fw-wrap">

        <div class="fw-card">
          <div class="fw-card-header">
            <span class="fw-icon">&#x1F697;</span>
            <span class="fw-title">VEHICLES</span>
            <span class="fw-sub">
              <button class="card-btn" onclick="fwDetectBoards()">&#x1F50C; Detect</button>
              <button class="card-btn" onclick="fwRefreshCache()">&#x21BB; Refresh</button>
            </span>
          </div>
          <div class="fw-card-body">
            <div class="fw-tab-bar" id="fwTabBar"></div>
          </div>
        </div>

        <div class="fw-card" style="flex:1;min-height:0;display:flex;flex-direction:column">
          <div class="fw-card-header">
            <span class="fw-icon">&#x26A1;</span>
            <span class="fw-title">FIRMWARE</span>
            <span class="fw-sub">
              <span class="fw-pill active" data-cat="stable" onclick="fwSwitchCategory('stable')">Stable</span>
              <span class="fw-pill" data-cat="beta" onclick="fwSwitchCategory('beta')">Beta</span>
              <span class="fw-pill" data-cat="latest" onclick="fwSwitchCategory('latest')">Latest</span>
              <span class="fw-pill" data-cat="legacy" onclick="fwSwitchCategory('legacy')">Legacy</span>
            </span>
          </div>
          <div class="fw-card-body" style="flex:1;min-height:0;display:flex;flex-direction:column">
            <div class="fw-search-bar">
              <input class="fw-search-input" id="fwSearchInput" type="text" placeholder="Search boards, versions, frames..." oninput="fwFilterBoards()">
            </div>
            <div class="fw-board-list" id="fwBoardList">
              <div class="fw-empty">Select a vehicle tab to show firmware options</div>
            </div>
          </div>
        </div>

        <div class="fw-selection-bar">
          <span class="fw-selection-label">Port:</span>
          <input class="fw-port-input" id="fwPortInput" type="text" placeholder="COM5">
          <span class="fw-selection-label" id="fwSelectionLabel">No board selected</span>
          <button class="card-btn card-btn-primary" id="fwFlashBtn" onclick="fwStartFlash()" disabled style="margin-left:auto">&#x26A1; Flash</button>
        </div>

      </div>
    </div>
  </div>

  <div id="notifContainer"></div>

  <div class="fw-modal-overlay" id="fwFlashModal">
    <div class="fw-modal">
      <button class="fw-modal-close" onclick="fwCloseModal()">&times;</button>
      <h2>&#x26A1; Flashing Firmware</h2>
      <div id="fwFlashInfo" style="font-size:12px;color:#64748b;margin-bottom:8px;"></div>
      <div class="fw-progress-bar">
        <div class="fw-progress-fill" id="fwProgressFill"></div>
      </div>
      <div class="fw-log-panel" id="fwLogPanel"></div>
    </div>
  </div>

  <script src="/static/lib/socket.io.min.js" onerror="this.onerror=null;this.src='https://cdn.socket.io/4.7.2/socket.io.min.js'"></script>
  <script src="/static/js/toolbar.js?v=13"></script>
  <script src="/static/js/firmware.js?v=1"></script>
</body>
</html>
